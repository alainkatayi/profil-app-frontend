<div class="avatar-wrap">
  @if (shown(); as src) {
    <img class="avatar-img" [src]="src" [alt]="name()" (error)="onError()" />
  } @else {
    <div class="avatar-img avatar-fallback" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="60" fill="#f4e4d8" />
        <circle cx="60" cy="50" r="18" fill="#f0c2a2" />
        <path d="M28 112c6-28 18-40 32-40s26 12 32 40" fill="#d4533c" />
        <path d="M40 48c2-16 10-24 20-24s18 8 20 24c-6 3-13 5-20 5s-14-2-20-5z" fill="#3a2a24" />
      </svg>
    </div>
  }

  @if (action() === 'edit') {
    <a class="avatar-badge" routerLink="/profile/edit" aria-label="Edit profile">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z" />
        <path d="M13.5 6.5l3 3" />
      </svg>
    </a>
  } @else {
    <label class="avatar-badge" [class.is-busy]="uploading()">
      @if (uploading()) {
        <span class="mini-spin"></span>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z" />
          <path d="M13.5 6.5l3 3" />
        </svg>
      }
      <input type="file" accept="image/*" hidden (change)="pick($event)" [disabled]="uploading()" />
    </label>
  }
</div>
