<app-auth-layout title="Log in" subtitle="Hello, friend! Sign in to your profile. Let's get in touch!">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate (input)="error.set('')">
    <div class="field">
      <label class="sr-only" for="login-email">Email</label>
      <input
        id="login-email"
        class="text-input"
        type="email"
        formControlName="email"
        placeholder="Email"
        autocomplete="username"
        spellcheck="false"
        [attr.aria-invalid]="invalid('email')"
        [attr.aria-describedby]="invalid('email') ? 'login-email-error' : null"
      />
      @if (invalid('email')) {
        <p class="field-hint" id="login-email-error">
          {{ form.controls.email.hasError('email') ? 'Enter a valid email.' : 'Email is required.' }}
        </p>
      }
    </div>

    <div class="field">
      <label class="sr-only" for="login-password">Password</label>
      <input
        id="login-password"
        class="text-input"
        type="password"
        formControlName="password"
        placeholder="Password"
        autocomplete="current-password"
        [attr.aria-invalid]="invalid('password')"
        [attr.aria-describedby]="invalid('password') ? 'login-password-error' : null"
      />
      @if (invalid('password')) {
        <p class="field-hint" id="login-password-error">Password is required.</p>
      }
    </div>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <button class="primary-btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Please wait…' : "Let's start!" }}
    </button>
  </form>

  <div class="socials">
    <span class="social" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="12" fill="#1877F2" />
        <path
          fill="#fff"
          d="M13.4 18.5v-5.2h1.7l.3-2h-2v-1.3c0-.6.2-1 1-1h1.1V7.1c-.2 0-1-.1-1.9-.1-1.9 0-3.1 1.1-3.1 3.2v1.1H8.8v2h1.7v5.2h2.9z"
        />
      </svg>
    </span>
    <span class="social" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <path
          fill="#FFC107"
          d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"
        />
        <path
          fill="#FF3D00"
          d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"
        />
        <path
          fill="#4CAF50"
          d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"
        />
        <path
          fill="#1976D2"
          d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.7 7.1l6.3 5.3C37.4 38.4 44 34 44 24c0-1.3-.1-2.7-.4-3.5z"
        />
      </svg>
    </span>
  </div>

  <p class="switch">
    Don't have an account?
    <a routerLink="/register">Sign up</a>
  </p>
</app-auth-layout>
